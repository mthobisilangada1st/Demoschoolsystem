<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Management System Demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="login">
 <form class="lbox" id="lf" onsubmit="return false">
  <h1>🎓 EduSync Portal</h1><p>Sign in to your school dashboard</p>
  <label for="sn">School name</label><input type="text" id="sn" placeholder="Insert school name" autocomplete="off">
  <label for="sg">School slogan (your password)</label>
  <div class="pw"><input type="password" id="sg" placeholder="Insert slogan" autocomplete="off"><button type="button" id="eye" aria-label="Show slogan">👁</button></div>
  <button class="btn" id="go">Log in</button>
  <div class="hint">Leave blank to use demo school details</div>
 </form>
</section>
<div id="app" class="hide">
 <header><div class="t"><b data-school>School Name</b><small data-slogan>School slogan</small></div>
  <button class="ib" id="th" aria-label="Toggle day and night">🌙</button><button class="ib" id="lo">Log out</button></header>
 <nav class="tabs" id="tabs"></nav>
 <main id="view"></main>
</div>
<script src="script.js"></script>
</body>
</html>
